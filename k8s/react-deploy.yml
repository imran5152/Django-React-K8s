apiVersion: apps/v1
kind: Deployment

metadata:
  name: college-frontend

spec:
  replicas: 2

  selector:
    matchLabels:
      app: college-frontend

  template:
    metadata:
      labels:
        app: college-frontend

    spec:
      containers:
        - name: college-frontend

          image: imran5152/college-frontend-k8s:latest
          imagePullPolicy: Always

          ports:
            - containerPort: 80

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"

            limits:
              cpu: "300m"
              memory: "256Mi"

          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 20

